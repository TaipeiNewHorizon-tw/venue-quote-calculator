<title>場地租借費用試算</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FBF6EC;
    --surface: #FFFFFF;
    --surface-2: #F5EEE0;
    --ink: #2A241D;
    --ink-soft: #5B5346;
    --muted: #8C8272;
    --border: #E7DCC6;
    --accent: #D9700F;
    --accent-deep: #B25508;
    --accent-soft: #FBE7D1;
    --weekday: #2F6F5E;
    --weekday-bg: #E4F1EC;
    --holiday: #B23A3A;
    --holiday-bg: #FBE7E4;
    --danger: #B23A3A;
    --danger-bg: #FBEAE8;
    --focus: #1D6F5E;
    --shadow: 0 1px 2px rgba(42,36,29,0.06), 0 8px 24px -12px rgba(42,36,29,0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1712;
      --surface: #252019;
      --surface-2: #2E2820;
      --ink: #F1E9DB;
      --ink-soft: #CBC0AE;
      --muted: #99907E;
      --border: #3C3527;
      --accent: #ED9143;
      --accent-deep: #F4A860;
      --accent-soft: #3A2A18;
      --weekday: #7AC7AE;
      --weekday-bg: #1F332C;
      --holiday: #E68E86;
      --holiday-bg: #3A2320;
      --danger: #E68E86;
      --danger-bg: #3A2320;
      --focus: #7AC7AE;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -12px rgba(0,0,0,0.6);
    }
  }

  :root[data-theme="dark"] {
    --bg: #1B1712;
    --surface: #252019;
    --surface-2: #2E2820;
    --ink: #F1E9DB;
    --ink-soft: #CBC0AE;
    --muted: #99907E;
    --border: #3C3527;
    --accent: #ED9143;
    --accent-deep: #F4A860;
    --accent-soft: #3A2A18;
    --weekday: #7AC7AE;
    --weekday-bg: #1F332C;
    --holiday: #E68E86;
    --holiday-bg: #3A2320;
    --danger: #E68E86;
    --danger-bg: #3A2320;
    --focus: #7AC7AE;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -12px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); }

  .page {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  header.hero {
    margin-bottom: 32px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-deep);
    font-weight: 700;
    margin-bottom: 14px;
  }
  .eyebrow::before {
    content: "";
    width: 20px;
    height: 2px;
    background: var(--accent);
    display: inline-block;
  }
  h1 {
    font-family: "Noto Serif TC", serif;
    font-weight: 700;
    font-size: clamp(1.7rem, 4vw, 2.35rem);
    margin: 0 0 12px;
    text-wrap: balance;
    color: var(--ink);
  }
  .lede {
    color: var(--ink-soft);
    font-size: 1.02rem;
    max-width: 62ch;
    margin: 0 0 20px;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 0.86rem;
    color: var(--ink-soft);
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.8rem;
  }
  .tag.weekday { background: var(--weekday-bg); color: var(--weekday); }
  .tag.holiday { background: var(--holiday-bg); color: var(--holiday); }
  .tag.dot::before { content: "●"; font-size: 0.6em; }

  section.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 20px;
  }

  h2 {
    font-family: "Noto Serif TC", serif;
    font-size: 1.15rem;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .section-sub {
    color: var(--muted);
    font-size: 0.88rem;
    margin: 0 0 18px;
  }

  #groups { display: flex; flex-direction: column; gap: 20px; }

  .group-card {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    background: var(--surface);
    position: relative;
  }
  .group-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .group-title-row { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 240px; }
  .field-label {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 6px;
    display: block;
  }
  select, input[type="date"], input[type="text"], input[type="tel"], input[type="email"], textarea {
    font-family: inherit;
    font-size: 0.96rem;
    color: var(--ink);
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    width: 100%;
  }
  select:focus, input:focus, textarea:focus {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
    border-color: var(--focus);
  }
  .room-select-wrap { max-width: 340px; }

  .room-checks {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-width: 480px;
  }
  .room-check {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.88rem;
    cursor: pointer;
    user-select: none;
    background: var(--surface);
  }
  .room-check input { accent-color: var(--accent); }
  .room-check.checked { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-deep); font-weight: 600; }

  .icon-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.85rem;
    padding: 6px 10px;
    border-radius: 8px;
    font-weight: 600;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--danger); }

  .rows-table { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
  .row-line {
    display: grid;
    grid-template-columns: minmax(140px,1fr) minmax(160px,1.2fr) minmax(140px,1fr) auto auto;
    gap: 10px;
    align-items: end;
    padding: 12px;
    background: var(--surface-2);
    border-radius: 10px;
  }
  .row-line .cell-label { font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; display: block; font-weight: 600; }
  .row-price {
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    min-width: 92px;
  }
  .row-price small { display: block; font-weight: 500; font-size: 0.7rem; color: var(--muted); }

  @media (max-width: 640px) {
    .row-line { grid-template-columns: 1fr 1fr; }
    .row-price { text-align: left; }
  }

  .add-row-btn, .add-group-btn {
    border: 1.5px dashed var(--border);
    background: transparent;
    color: var(--accent-deep);
    font-weight: 700;
    font-size: 0.9rem;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
    text-align: center;
  }
  .add-row-btn:hover, .add-group-btn:hover { background: var(--accent-soft); border-color: var(--accent); }

  .group-subtotal {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding-top: 14px;
    margin-top: 4px;
    border-top: 1px dashed var(--border);
    font-weight: 700;
  }
  .group-subtotal .num { font-variant-numeric: tabular-nums; font-size: 1.05rem; white-space: nowrap; }
  @media (max-width: 480px) {
    .group-subtotal { flex-direction: column; align-items: flex-start; gap: 4px; }
  }

  .warn-box {
    background: var(--danger-bg);
    color: var(--danger);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.85rem;
    margin-top: 10px;
    font-weight: 600;
  }
  .warn-box ul { margin: 4px 0 0; padding-left: 18px; }

  .ref-table {
    margin-top: 14px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .ref-table table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  .ref-table th, .ref-table td { text-align: right; padding: 6px 8px; font-variant-numeric: tabular-nums; }
  .ref-table th:first-child, .ref-table td:first-child { text-align: left; }
  .ref-table thead th { color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); }
  .ref-table tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
  .ref-note { color: var(--muted); font-size: 0.78rem; margin-top: 8px; }

  .remove-group {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 8px;
  }
  .remove-group:hover { color: var(--danger); background: var(--danger-bg); }

  .summary-card {
    background: linear-gradient(160deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1.5px solid var(--accent);
  }
  .summary-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .summary-line { display: flex; justify-content: space-between; font-size: 0.94rem; color: var(--ink-soft); }
  .summary-line .num { font-variant-numeric: tabular-nums; }
  .summary-line.total { font-size: 1.4rem; font-weight: 800; color: var(--ink); border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px; }
  .summary-line.total .num { color: var(--accent-deep); }

  .disclaimer {
    font-size: 0.82rem;
    color: var(--muted);
    background: var(--surface-2);
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 14px;
  }
  .disclaimer p { margin: 0 0 6px; }
  .disclaimer p:last-child { margin-bottom: 0; }

  form.contact-form { display: flex; flex-direction: column; gap: 14px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
  textarea { min-height: 84px; resize: vertical; }

  .action-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border-radius: 10px;
    padding: 12px 20px;
    font-weight: 700;
    font-size: 0.94rem;
    cursor: pointer;
    border: 1.5px solid transparent;
    text-decoration: none;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-deep); }
  .btn-secondary { background: transparent; border-color: var(--border); color: var(--ink); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent-deep); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.86rem;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    box-shadow: var(--shadow);
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer.foot {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 30px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="page">
  <header class="hero">
    <span class="eyebrow">臺北文創 Taipei New Horizon｜場地租借</span>
    <h1>場地租借費用試算</h1>
    <p class="lede">選擇場地、時段與用途（場佈進場／活動／撤場），系統會依平日、假日費率自動試算租金。可同時勾選多個場地一起報價。</p>
    <div class="legend">
      <span class="tag weekday dot">平日價</span>
      <span class="tag holiday dot">假日價（含六日與國定假日）</span>
    </div>
  </header>

  <main>
    <section id="groups"></section>

    <button class="add-group-btn" id="addGroupBtn" type="button">＋ 新增場地項目</button>

    <section class="card summary-card" style="margin-top:20px;">
      <h2>報價總計</h2>
      <p class="section-sub">以下為所有場地項目加總後的金額</p>
      <div class="summary-rows" id="summaryRows"></div>
      <div class="disclaimer" id="disclaimerBox"></div>
    </section>

    <section class="card" id="contactCard">
      <h2>留下聯絡資料</h2>
      <p class="section-sub">填寫後可將試算內容複製，傳送給我們或帶到「聯絡我們」頁面送出詢價</p>
      <form class="contact-form" id="contactForm">
        <div class="form-grid">
          <div>
            <span class="field-label">姓名 / 公司名稱</span>
            <input type="text" id="ctName" placeholder="例：王小姐 / ○○活動公司" />
          </div>
          <div>
            <span class="field-label">聯絡電話</span>
            <input type="tel" id="ctPhone" placeholder="例：0912-345-678" />
          </div>
          <div>
            <span class="field-label">Email（選填）</span>
            <input type="email" id="ctEmail" placeholder="example@mail.com" />
          </div>
          <div>
            <span class="field-label">活動名稱（選填）</span>
            <input type="text" id="ctEvent" placeholder="例：品牌年度發表會" />
          </div>
        </div>
        <div>
          <span class="field-label">備註</span>
          <textarea id="ctNote" placeholder="現場人數、動線、特殊需求等"></textarea>
        </div>
        <div class="action-row">
          <button type="button" class="btn btn-primary" id="copyBtn">複製報價內容</button>
          <a class="btn btn-secondary" id="contactLink" href="https://www.taipeinewhorizon.com.tw/contact-us" target="_blank" rel="noopener">前往「聯絡我們」送出</a>
        </div>
        <div id="quotePreviewWrap" style="display:none;">
          <span class="field-label">報價內容預覽（若無法自動複製，請手動全選複製）</span>
          <textarea id="quotePreview" readonly style="min-height:160px;font-size:0.85rem;"></textarea>
        </div>
      </form>
    </section>
  </main>

  <footer class="foot">臺北文創六樓多功能廳 · 六樓會議室 · 十四樓文創會所 Muse Garden</footer>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  // ---------- Data ----------
  var TAX_RATE = 0.05;

  var SESSION_TYPES = {
    morning:   { label: "上午 08:00–12:00", kind: "single",  startMin: 8*60,  endMin: 12*60 },
    afternoon: { label: "下午 13:00–17:00", kind: "single",  startMin: 13*60, endMin: 17*60 },
    fullday:   { label: "白天 08:00–17:00", kind: "fullday", startMin: 8*60,  endMin: 17*60 },
    evening:   { label: "晚上 18:00–22:00", kind: "evening", startMin: 18*60, endMin: 22*60 }
  };
  var SESSION_ORDER = ["morning", "afternoon", "fullday", "evening"];

  var PURPOSES = {
    activity: { label: "活動", mult: 1 },
    loadin:   { label: "進場（場佈）", mult: 0.5 },
    loadout:  { label: "撤場（復原）", mult: 0.5 }
  };
  var PURPOSE_ORDER = ["activity", "loadin", "loadout"];

  // rates = [非假日單一時段, 非假日白天, 假日單一時段, 假日白天, 晚上一律] ，2026年優惠價 / 未稅
  var VENUE_DEFS = {
    functionHall: {
      name: "6樓・多功能廳",
      type: "combo",
      rooms: {
        A: { label: "A廳", rates: [18080, 27040, 21600, 32400, 21600] },
        B: { label: "B廳", rates: [18080, 27040, 21600, 32400, 21600] },
        C: { label: "C廳", rates: [18080, 27040, 21600, 32400, 21600] },
        D: { label: "D廳", rates: [36000, 54000, 43200, 64800, 43200] },
        E: { label: "E廳", rates: [36000, 54000, 43200, 64800, 43200] },
        F: { label: "F廳", rates: [22240, 33440, 26720, 40000, 26720] }
      },
      combos: [
        ["A"], ["B"], ["C"], ["D"], ["E"], ["F"],
        ["A","B"], ["B","C"], ["A","B","C"],
        ["D","E"], ["E","F"], ["D","E","F"],
        ["A","B","C","D","E","F"]
      ]
    },
    meetingRoom: {
      name: "6樓・會議室",
      type: "multi",
      rooms: (function () {
        var r = {};
        var ids = ["601","602","603","604","605","606","607","608"];
        for (var i = 0; i < ids.length; i++) {
          r[ids[i]] = { label: ids[i] + " 會議室", rates: [7840, 11840, 9440, 14240, 9440] };
        }
        return r;
      })()
    },
    eventSpace: {
      name: "14樓・文創會所 Muse Garden",
      type: "single",
      rates: [206400, 310400, 246400, 368000, 246400]
    }
  };
  var VENUE_ORDER = ["functionHall", "meetingRoom", "eventSpace"];

  // 國定假日（六日以外，需另外標記為假日價的日期）
  // 整理自行政院人事行政總處 115年(2026)／116年(2027) 政府行政機關辦公日曆表及媒體報導彙整，
  // 若與官方公告有出入，請直接修改下方清單。
  var NATIONAL_HOLIDAYS = [
    // 2026（115年）
    "2026-01-01",
    "2026-02-16","2026-02-17","2026-02-18","2026-02-19","2026-02-20",
    "2026-02-27",
    "2026-04-03","2026-04-06",
    "2026-05-01",
    "2026-06-19",
    "2026-09-25","2026-09-28",
    "2026-10-09",
    "2026-10-26",
    "2026-12-25",
    // 2027（116年）
    "2027-01-01",
    "2027-02-04","2027-02-05","2027-02-08","2027-02-09","2027-02-10",
    "2027-03-01",
    "2027-04-05","2027-04-06",
    "2027-04-30",
    "2027-06-09",
    "2027-09-15",
    "2027-09-28",
    "2027-10-11",
    "2027-10-25",
    "2027-12-24",
    "2027-12-31"
  ];
  var HOLIDAY_SET = {};
  NATIONAL_HOLIDAYS.forEach(function (d) { HOLIDAY_SET[d] = true; });

  var MAX_DATE = "2027-12-31";

  function todayStr() {
    var d = new Date();
    var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
    return y + "-" + m + "-" + day;
  }
  var MIN_DATE = todayStr();

  function isHoliday(dateStr) {
    if (!dateStr) return false;
    var d = new Date(dateStr + "T00:00:00");
    var day = d.getDay();
    if (day === 0 || day === 6) return true;
    return !!HOLIDAY_SET[dateStr];
  }

  function fmt(n) {
    return Math.round(n).toLocaleString("zh-TW");
  }

  function rowSortKey(dateStr, min) {
    return dateStr + "-" + String(min).padStart(4, "0");
  }

  // ---------- State ----------
  var uid = 1;
  function nextId() { return "id" + (uid++); }

  var state = { groups: [] };

  function makeGroup(venueKey) {
    var g = { id: nextId(), venue: venueKey, comboKey: null, rooms: [], rows: [] };
    if (venueKey === "functionHall") {
      g.comboKey = "A";
      g.rooms = ["A"];
    } else if (venueKey === "meetingRoom") {
      g.rooms = ["601"];
    } else if (venueKey === "eventSpace") {
      g.rooms = ["__single__"];
    }
    g.rows.push(makeRow());
    return g;
  }

  function makeRow() {
    return { id: nextId(), date: MIN_DATE, session: "fullday", purpose: "activity" };
  }

  state.groups.push(makeGroup("functionHall"));

  // ---------- Pricing ----------
  function combinedRates(group) {
    var def = VENUE_DEFS[group.venue];
    if (def.type === "single") return def.rates.slice();
    var sum = [0,0,0,0,0];
    var roomIds = def.type === "combo" ? (group.comboKey ? group.comboKey.split(",") : []) : group.rooms;
    roomIds.forEach(function (rid) {
      var room = def.rooms[rid];
      if (!room) return;
      for (var i = 0; i < 5; i++) sum[i] += room.rates[i];
    });
    return sum;
  }

  function sessionRate(rates, sessionKey, holiday) {
    var t = SESSION_TYPES[sessionKey];
    if (t.kind === "single") return holiday ? rates[2] : rates[0];
    if (t.kind === "fullday") return holiday ? rates[3] : rates[1];
    return rates[4];
  }

  function rowPrice(group, row) {
    var rates = combinedRates(group);
    var holiday = isHoliday(row.date);
    var base = sessionRate(rates, row.session, holiday);
    var mult = PURPOSES[row.purpose].mult;
    return { price: base * mult, holiday: holiday, base: base };
  }

  function validateGroup(group) {
    var errs = [];
    var activity = group.rows.filter(function (r) { return r.purpose === "activity"; });
    if (group.rows.length === 0) return errs;
    if (activity.length === 0) {
      errs.push("此場地項目必須包含至少一個「活動」時段（不可只買進場或撤場）");
      return errs;
    }
    function keyStart(r) { return rowSortKey(r.date, SESSION_TYPES[r.session].startMin); }
    function keyEnd(r) { return rowSortKey(r.date, SESSION_TYPES[r.session].endMin); }
    var starts = activity.map(keyStart).sort();
    var ends = activity.map(keyEnd).sort();
    var minActStart = starts[0];
    var maxActEnd = ends[ends.length - 1];
    group.rows.forEach(function (r) {
      if (r.purpose === "loadin" && keyEnd(r) > minActStart) {
        errs.push("進場時段（" + r.date + " " + SESSION_TYPES[r.session].label + "）必須在活動開始之前");
      }
      if (r.purpose === "loadout" && keyStart(r) < maxActEnd) {
        errs.push("撤場時段（" + r.date + " " + SESSION_TYPES[r.session].label + "）必須在活動結束之後");
      }
    });
    // overlap check (same date, overlapping time range)
    for (var i = 0; i < group.rows.length; i++) {
      for (var j = i + 1; j < group.rows.length; j++) {
        var a = group.rows[i], b = group.rows[j];
        if (a.date && a.date === b.date) {
          var at = SESSION_TYPES[a.session], bt = SESSION_TYPES[b.session];
          if (at.startMin < bt.endMin && bt.startMin < at.endMin) {
            errs.push(a.date + " 有重疊的時段，請確認是否重複選取");
          }
        }
      }
    }
    return errs;
  }

  function groupSubtotal(group) {
    var total = 0;
    group.rows.forEach(function (r) { total += rowPrice(group, r).price; });
    return total;
  }

  // ---------- Rendering ----------
  var groupsEl = document.getElementById("groups");
  var summaryRowsEl = document.getElementById("summaryRows");
  var disclaimerBoxEl = document.getElementById("disclaimerBox");

  function venueOptionsHtml(selected) {
    return VENUE_ORDER.map(function (k) {
      return '<option value="' + k + '"' + (k === selected ? " selected" : "") + ">" + VENUE_DEFS[k].name + "</option>";
    }).join("");
  }

  function comboOptionsHtml(group) {
    var def = VENUE_DEFS.functionHall;
    return def.combos.map(function (combo) {
      var key = combo.join(",");
      var label = combo.length === 6 ? "全館 A+B+C+D+E+F 廳" : combo.join("+") + " 廳";
      return '<option value="' + key + '"' + (key === group.comboKey ? " selected" : "") + ">" + label + "</option>";
    }).join("");
  }

  function roomChecksHtml(group) {
    var def = VENUE_DEFS.meetingRoom;
    return Object.keys(def.rooms).map(function (rid) {
      var checked = group.rooms.indexOf(rid) !== -1;
      return '<label class="room-check' + (checked ? ' checked' : '') + '" data-room-toggle="' + rid + '">' +
        '<input type="checkbox" ' + (checked ? "checked" : "") + ' />' + def.rooms[rid].label + '</label>';
    }).join("");
  }

  function sessionOptionsHtml(selected) {
    return SESSION_ORDER.map(function (k) {
      return '<option value="' + k + '"' + (k === selected ? " selected" : "") + ">" + SESSION_TYPES[k].label + "</option>";
    }).join("");
  }

  function purposeOptionsHtml(selected) {
    return PURPOSE_ORDER.map(function (k) {
      return '<option value="' + k + '"' + (k === selected ? " selected" : "") + ">" + PURPOSES[k].label + "</option>";
    }).join("");
  }

  function refTableHtml(group) {
    var rates = combinedRates(group);
    return '<div class="ref-table"><table>' +
      '<thead><tr><th>時段</th><th>平日</th><th>假日</th></tr></thead>' +
      '<tbody>' +
      '<tr><td>單一時段（上午或下午）</td><td>' + fmt(rates[0]) + '</td><td>' + fmt(rates[2]) + '</td></tr>' +
      '<tr><td>白天（08:00–17:00）</td><td>' + fmt(rates[1]) + '</td><td>' + fmt(rates[3]) + '</td></tr>' +
      '<tr><td>晚上（18:00–22:00）</td><td colspan="2" style="text-align:right;">' + fmt(rates[4]) + '（平假日同價）</td></tr>' +
      '</tbody></table>' +
      '<p class="ref-note">以上為「活動」用途之未稅牌價；進場／撤場一律以同時段之五折計算。</p>' +
      '</div>';
  }

  function renderGroup(group, index) {
    var def = VENUE_DEFS[group.venue];
    var wrap = document.createElement("div");
    wrap.className = "group-card";
    wrap.setAttribute("data-group-id", group.id);

    var head = document.createElement("div");
    head.className = "group-head";

    var titleRow = document.createElement("div");
    titleRow.className = "group-title-row";

    var venueField = document.createElement("div");
    venueField.className = "room-select-wrap";
    venueField.innerHTML = '<span class="field-label">場地項目 ' + (index+1) + '</span>' +
      '<select data-action="venue-change">' + venueOptionsHtml(group.venue) + '</select>';
    titleRow.appendChild(venueField);

    if (def.type === "combo") {
      var comboField = document.createElement("div");
      comboField.className = "room-select-wrap";
      comboField.innerHTML = '<span class="field-label">選擇廳別 / 組合</span>' +
        '<select data-action="combo-change">' + comboOptionsHtml(group) + '</select>';
      titleRow.appendChild(comboField);
    } else if (def.type === "multi") {
      var multiField = document.createElement("div");
      multiField.innerHTML = '<span class="field-label">選擇會議室（可複選）</span>' +
        '<div class="room-checks">' + roomChecksHtml(group) + '</div>';
      titleRow.appendChild(multiField);
    } else {
      var singleField = document.createElement("div");
      singleField.innerHTML = '<span class="field-label">場地</span><div style="padding:8px 0;color:var(--ink-soft);font-weight:600;">整層出租（不分割）</div>';
      titleRow.appendChild(singleField);
    }

    head.appendChild(titleRow);

    if (state.groups.length > 1) {
      var removeBtn = document.createElement("button");
      removeBtn.className = "remove-group";
      removeBtn.type = "button";
      removeBtn.setAttribute("data-action", "remove-group");
      removeBtn.textContent = "移除此項目 ✕";
      head.appendChild(removeBtn);
    }

    wrap.appendChild(head);

    var rowsWrap = document.createElement("div");
    rowsWrap.className = "rows-table";

    group.rows.forEach(function (row) {
      var rp = rowPrice(group, row);
      var line = document.createElement("div");
      line.className = "row-line";
      line.setAttribute("data-row-id", row.id);
      line.innerHTML =
        '<div><span class="cell-label">日期</span>' +
          '<input type="date" data-action="date-change" value="' + row.date + '" min="' + MIN_DATE + '" max="' + MAX_DATE + '" /></div>' +
        '<div><span class="cell-label">時段</span>' +
          '<select data-action="session-change">' + sessionOptionsHtml(row.session) + '</select></div>' +
        '<div><span class="cell-label">用途</span>' +
          '<select data-action="purpose-change">' + purposeOptionsHtml(row.purpose) + '</select></div>' +
        '<div class="row-price">' + fmt(rp.price) +
          '<small class="tag ' + (rp.holiday ? "holiday" : "weekday") + ' dot">' + (rp.holiday ? "假日" : "平日") + '</small></div>' +
        '<div><button type="button" class="icon-btn" data-action="remove-row" title="刪除時段">✕</button></div>';
      rowsWrap.appendChild(line);
    });

    wrap.appendChild(rowsWrap);

    var addRowBtn = document.createElement("button");
    addRowBtn.type = "button";
    addRowBtn.className = "add-row-btn";
    addRowBtn.setAttribute("data-action", "add-row");
    addRowBtn.textContent = "＋ 新增時段";
    wrap.appendChild(addRowBtn);

    var errs = validateGroup(group);
    if (errs.length) {
      var warn = document.createElement("div");
      warn.className = "warn-box";
      warn.innerHTML = "請確認以下項目：<ul>" + errs.map(function (e) { return "<li>" + e + "</li>"; }).join("") + "</ul>";
      wrap.appendChild(warn);
    }

    var subtotal = document.createElement("div");
    subtotal.className = "group-subtotal";
    subtotal.innerHTML = "<span>" + def.name + (def.type === "combo" ? "（" + group.comboKey.split(",").join("+") + "）" : "") + " 小計（未稅）</span><span class=\"num\">NT$ " + fmt(groupSubtotal(group)) + "</span>";
    wrap.appendChild(subtotal);

    var ref = document.createElement("div");
    ref.innerHTML = refTableHtml(group);
    wrap.appendChild(ref);

    return wrap;
  }

  function render() {
    groupsEl.innerHTML = "";
    state.groups.forEach(function (g, i) {
      groupsEl.appendChild(renderGroup(g, i));
    });

    var subtotal = 0;
    var hasError = false;
    state.groups.forEach(function (g) {
      subtotal += groupSubtotal(g);
      if (validateGroup(g).length) hasError = true;
    });
    var tax = Math.round(subtotal * TAX_RATE);
    var total = subtotal + tax;

    summaryRowsEl.innerHTML =
      '<div class="summary-line"><span>租金小計（未稅）</span><span class="num">NT$ ' + fmt(subtotal) + '</span></div>' +
      '<div class="summary-line"><span>營業稅（5%）</span><span class="num">NT$ ' + fmt(tax) + '</span></div>' +
      '<div class="summary-line total"><span>總計（含稅）</span><span class="num">NT$ ' + fmt(total) + '</span></div>' +
      (hasError ? '<div class="warn-box" style="margin-top:10px;">上方有場地項目的時段設定尚未符合規則，請修正後金額才會是正確的正式報價。</div>' : '');

    disclaimerBoxEl.innerHTML =
      '<p>以上金額為場地租金試算金額，<strong>保證金與超時費另計</strong>，實際保證金／超時費請洽本公司窗口確認。</p>' +
      '<p>國定假日（含補假日）採計至 2027 年底，資料整理自政府行政機關辦公日曆表；如遇官方公告調整，或所選日期超過 2027 年底，請與我們確認假日價適用範圍。</p>' +
      '<p>本頁試算僅供參考，正式報價與場地保留仍須經本公司書面確認。</p>';
  }

  // ---------- Events ----------
  document.getElementById("addGroupBtn").addEventListener("click", function () {
    state.groups.push(makeGroup("functionHall"));
    render();
  });

  groupsEl.addEventListener("click", function (e) {
    var actionEl = e.target.closest("[data-action]");
    var groupEl = e.target.closest("[data-group-id]");
    if (!groupEl) return;
    var group = state.groups.find(function (g) { return g.id === groupEl.getAttribute("data-group-id"); });
    if (!group) return;

    if (actionEl && actionEl.getAttribute("data-action") === "remove-group") {
      state.groups = state.groups.filter(function (g) { return g.id !== group.id; });
      render();
      return;
    }
    if (actionEl && actionEl.getAttribute("data-action") === "add-row") {
      group.rows.push(makeRow());
      render();
      return;
    }
    if (actionEl && actionEl.getAttribute("data-action") === "remove-row") {
      var rowEl = e.target.closest("[data-row-id]");
      var rowId = rowEl.getAttribute("data-row-id");
      group.rows = group.rows.filter(function (r) { return r.id !== rowId; });
      if (group.rows.length === 0) group.rows.push(makeRow());
      render();
      return;
    }
    var roomToggleEl = e.target.closest("[data-room-toggle]");
    if (roomToggleEl) {
      var rid = roomToggleEl.getAttribute("data-room-toggle");
      var idx = group.rooms.indexOf(rid);
      if (idx === -1) group.rooms.push(rid); else group.rooms.splice(idx, 1);
      if (group.rooms.length === 0) group.rooms.push(rid);
      render();
      return;
    }
  });

  groupsEl.addEventListener("change", function (e) {
    var groupEl = e.target.closest("[data-group-id]");
    if (!groupEl) return;
    var group = state.groups.find(function (g) { return g.id === groupEl.getAttribute("data-group-id"); });
    if (!group) return;
    var action = e.target.getAttribute("data-action");

    if (action === "venue-change") {
      var newVenue = e.target.value;
      var replacement = makeGroup(newVenue);
      replacement.id = group.id;
      var gi = state.groups.indexOf(group);
      state.groups[gi] = replacement;
      render();
      return;
    }
    if (action === "combo-change") {
      group.comboKey = e.target.value;
      render();
      return;
    }
    var rowEl = e.target.closest("[data-row-id]");
    if (!rowEl) return;
    var row = group.rows.find(function (r) { return r.id === rowEl.getAttribute("data-row-id"); });
    if (!row) return;
    if (action === "date-change") row.date = e.target.value;
    if (action === "session-change") row.session = e.target.value;
    if (action === "purpose-change") row.purpose = e.target.value;
    render();
  });

  // ---------- Contact / copy ----------
  var toastEl = document.getElementById("toast");
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(function () { toastEl.classList.remove("show"); }, 2400);
  }

  function buildQuoteText() {
    var lines = [];
    lines.push("【臺北文創 場地租借試算】");
    var name = document.getElementById("ctName").value.trim();
    var phone = document.getElementById("ctPhone").value.trim();
    var email = document.getElementById("ctEmail").value.trim();
    var eventName = document.getElementById("ctEvent").value.trim();
    var note = document.getElementById("ctNote").value.trim();
    if (name) lines.push("姓名/公司：" + name);
    if (phone) lines.push("聯絡電話：" + phone);
    if (email) lines.push("Email：" + email);
    if (eventName) lines.push("活動名稱：" + eventName);
    lines.push("");

    var subtotal = 0;
    state.groups.forEach(function (g, gi) {
      var def = VENUE_DEFS[g.venue];
      var title = def.name + (def.type === "combo" ? "（" + g.comboKey.split(",").join("+") + "）" : def.type === "multi" ? "（" + g.rooms.map(function(r){return VENUE_DEFS.meetingRoom.rooms[r].label;}).join("、") + "）" : "");
      lines.push((gi+1) + ". " + title);
      g.rows.forEach(function (r) {
        var rp = rowPrice(g, r);
        subtotal += rp.price;
        lines.push("　" + r.date + "（" + (rp.holiday ? "假日" : "平日") + "）" + SESSION_TYPES[r.session].label + " ／ " + PURPOSES[r.purpose].label + "：NT$ " + fmt(rp.price));
      });
      lines.push("　小計：NT$ " + fmt(groupSubtotal(g)));
      lines.push("");
    });

    var tax = Math.round(subtotal * TAX_RATE);
    lines.push("租金小計（未稅）：NT$ " + fmt(subtotal));
    lines.push("營業稅（5%）：NT$ " + fmt(tax));
    lines.push("總計（含稅）：NT$ " + fmt(subtotal + tax));
    lines.push("");
    lines.push("＊保證金與超時費另計，正式報價以本公司書面確認為準。");
    if (note) { lines.push(""); lines.push("備註：" + note); }
    return lines.join("\n");
  }

  document.getElementById("copyBtn").addEventListener("click", function () {
    var text = buildQuoteText();
    var previewWrap = document.getElementById("quotePreviewWrap");
    var previewArea = document.getElementById("quotePreview");
    previewArea.value = text;
    previewWrap.style.display = "block";
    previewArea.focus();
    previewArea.select();

    function tryExecCommand() {
      try { return document.execCommand("copy"); } catch (err) { return false; }
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast("已複製報價內容，請貼給我們或帶到聯絡我們頁面送出");
      }).catch(function () {
        var ok = tryExecCommand();
        showToast(ok ? "已複製報價內容，請貼給我們或帶到聯絡我們頁面送出" : "自動複製失敗，下方已選取文字，請按 Ctrl/Cmd+C 手動複製");
      });
    } else {
      var ok = tryExecCommand();
      showToast(ok ? "已複製報價內容，請貼給我們或帶到聯絡我們頁面送出" : "自動複製失敗，下方已選取文字，請按 Ctrl/Cmd+C 手動複製");
    }
  });

  render();
})();
</script>
